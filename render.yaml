# Render Blueprint for the backend API (the frontend deploys separately to Vercel).
# Secrets marked sync:false are entered in the Render dashboard, never committed.
# Full walkthrough: docs/DEPLOYMENT.md
services:
  - type: web
    name: rag-platform-api
    runtime: docker
    rootDir: backend                       # only changes under backend/ trigger deploys
    dockerContext: ./backend               # Docker paths are relative to the repo root
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health
    # 1 CPU / 2 GB RAM. PyTorch + the cross-encoder need well over the 512 MB of the
    # smallest plans; persistent disks also require a paid instance.
    plan: 1c-2g
    disk:                                  # persists SQLite metadata + model cache
      name: rag-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: HF_HOME                       # keep the downloaded reranker on the disk
        value: /app/data/hf-cache
      - key: RERANKER_PRELOAD              # load the model at startup, not on first chat
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: OPENAI_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: QDRANT_URL                    # Qdrant Cloud cluster URL, including :6333
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: CORS_ORIGINS                  # e.g. https://your-app.vercel.app (no trailing slash)
        sync: false
